name: operacoes-prospera

# Pronto para servidor (Easypanel): nenhuma porta é aberta no servidor.
# O domínio é ligado no painel, apontando para o serviço "app", porta 80.
# Para usar no computador, com as portas abertas, veja docker-compose.local.yml.
services:
  app:
    build: .
    environment:
      APP_USUARIOS: ${APP_USUARIOS}
      APP_ADMIN: ${APP_ADMIN}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_TZ: ${APP_TZ:-America/Cuiaba}
      APP_BASE: ${APP_BASE:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_WAIT: "1"
    volumes:
      # Fotos e sessões ficam num volume: sobrevivem a cada nova versão.
      - operacoes_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - operacoes_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

volumes:
  operacoes_db:
  operacoes_storage:
